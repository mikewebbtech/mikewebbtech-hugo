{{ define "main" }}
<article class="home">
  {{- with .Params.postIMG }} {{ $image := . }}
  <div class="home-image">
    <img src="{{ . | relURL }}" alt="{{ . }}" />
  </div>
  {{ end -}}
  <h3 class="subtitle">{{ .Params.Subtitle }}</h3>
  {{ partial "heading-colours.html" .Content }}
</article>
{{ end }}
